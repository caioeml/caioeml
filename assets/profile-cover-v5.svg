<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer cover for Caio Lima</title>
  <desc id="desc">A dark blue and red animated developer cover with moving web lines and a polished spider-inspired circular mask emblem.</desc>
  <style>
    .web { stroke-dasharray: 22 20; animation: dash 9s linear infinite; }
    .web2 { stroke-dasharray: 12 24; animation: dash 12s linear infinite reverse; }
    .shade { animation: shade 6s ease-in-out infinite; }
    .blink { animation: blink 2.8s ease-in-out infinite; }
    .code { animation: codeSlide 8s linear infinite; }
    .badgeFloat { animation: floatY 4.8s ease-in-out infinite; }
    .pulse { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes dash { to { stroke-dashoffset: -260; } }
    @keyframes shade { 0%,100% { opacity: .16; } 50% { opacity: .32; } }
    @keyframes blink { 0%,45%,100% { opacity: .35; } 55%,70% { opacity: 1; } }
    @keyframes codeSlide { 0% { transform: translateX(-80px); opacity: .16; } 20%,80% { opacity: .46; } 100% { transform: translateX(80px); opacity: .16; } }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .74; transform: scale(1.04); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050b16" />
      <stop offset="0.48" stop-color="#0d285d" />
      <stop offset="1" stop-color="#741124" />
    </linearGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(998 166) rotate(140) scale(310 220)">
      <stop stop-color="#d91f3e" stop-opacity=".48" />
      <stop offset="1" stop-color="#d91f3e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 115) rotate(30) scale(420 190)">
      <stop stop-color="#1d68d8" stop-opacity=".42" />
      <stop offset="1" stop-color="#1d68d8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="maskFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 148) rotate(90) scale(116)">
      <stop stop-color="#f01935" />
      <stop offset="1" stop-color="#a70f23" />
    </radialGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="maskCircle">
      <circle cx="1000" cy="166" r="102" />
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <rect width="1200" height="360" rx="28" fill="url(#blueGlow)" />
  <rect width="1200" height="360" rx="28" fill="url(#rightGlow)" />
  <rect class="shade" width="1200" height="360" rx="28" fill="#020712" />

  <g opacity=".3" stroke="#eaf6ff" stroke-linecap="round">
    <path class="web" d="M-42 76C126 42 286 58 442 102C640 158 792 123 958 52C1063 7 1146 12 1244 54" stroke-width="2" />
    <path class="web2" d="M-38 286C146 225 284 251 452 214C634 174 780 219 932 289C1044 341 1144 331 1236 276" stroke-width="2" />
    <path class="web" d="M1120 -25C1018 75 920 151 805 215C690 279 555 327 430 385" stroke-width="1.7" />
    <path class="web2" d="M1218 123C1080 132 954 158 830 218C733 264 654 322 583 399" stroke-width="1.7" />
  </g>

  <g opacity=".16" stroke="#ffffff" stroke-width="1">
    <path d="M1030 42L836 214L952 289M836 214L442 102M836 214L452 214M836 214L1244 54" />
    <circle cx="836" cy="214" r="78" />
    <circle cx="836" cy="214" r="136" />
    <circle cx="836" cy="214" r="204" />
  </g>

  <g transform="translate(72 72)">
    <text x="0" y="54" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Caio Lima</text>
    <text x="0" y="96" fill="#b9ddff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Desenvolvedor Full Stack em evolução</text>
    <text x="0" y="138" fill="#eaf6ff" font-family="Segoe UI, Arial, sans-serif" font-size="20">React • JavaScript • PHP • MySQL • C# • .NET</text>
  </g>

  <g class="code" fill="#9fd8ff" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18">
    <text x="92" y="304">&lt;React /&gt;</text>
    <text x="254" y="304">const dev = 'Caio';</text>
    <text x="540" y="304">API + UI + DB</text>
  </g>

  <g class="badgeFloat" filter="url(#softGlow)">
    <circle class="pulse" cx="1000" cy="166" r="124" stroke="#ff405c" stroke-width="3" fill="none" />
    <circle cx="1000" cy="166" r="108" fill="#05070d" />
    <circle cx="1000" cy="166" r="99" fill="url(#maskFill)" />

    <g clip-path="url(#maskCircle)">
      <path d="M1000 66V266" stroke="#140208" stroke-width="5" />
      <path d="M925 92C956 117 978 142 1000 166C1022 142 1044 117 1075 92" stroke="#140208" stroke-width="4" fill="none" />
      <path d="M905 134C950 154 978 161 1000 166C1022 161 1050 154 1095 134" stroke="#140208" stroke-width="4" fill="none" />
      <path d="M903 198C948 181 977 171 1000 166C1023 171 1052 181 1097 198" stroke="#140208" stroke-width="4" fill="none" />
      <path d="M927 244C957 219 979 190 1000 166C1021 190 1043 219 1073 244" stroke="#140208" stroke-width="4" fill="none" />
      <path d="M916 166H1084" stroke="#140208" stroke-width="3" opacity=".85" />
      <path d="M948 78C970 110 983 139 1000 166C1017 139 1030 110 1052 78" stroke="#140208" stroke-width="3" opacity=".76" />
      <path d="M948 254C970 222 983 193 1000 166C1017 193 1030 222 1052 254" stroke="#140208" stroke-width="3" opacity=".76" />
      <path d="M918 118C945 128 968 135 1000 136C1032 135 1055 128 1082 118" stroke="#140208" stroke-width="3" opacity=".72" />
      <path d="M912 214C944 204 968 198 1000 196C1032 198 1056 204 1088 214" stroke="#140208" stroke-width="3" opacity=".72" />
    </g>

    <path d="M906 150C923 113 962 95 997 127C976 169 931 187 906 150Z" fill="#07090f" />
    <path d="M1094 150C1077 113 1038 95 1003 127C1024 169 1069 187 1094 150Z" fill="#07090f" />
    <path d="M924 148C940 122 966 112 991 130C971 158 943 170 924 148Z" fill="#f2fbff" />
    <path d="M1076 148C1060 122 1034 112 1009 130C1029 158 1057 170 1076 148Z" fill="#f2fbff" />
    <circle cx="1000" cy="166" r="12" fill="#e91631" stroke="#140208" stroke-width="3" />
    <circle cx="1000" cy="166" r="108" stroke="#05070d" stroke-width="10" fill="none" />
    <circle cx="1000" cy="166" r="100" stroke="#ff5972" stroke-width="3" fill="none" opacity=".8" />
  </g>

  <g class="blink" filter="url(#softGlow)">
    <circle cx="160" cy="46" r="4" fill="#ffffff" />
    <circle cx="1090" cy="260" r="4" fill="#ffffff" />
    <circle cx="782" cy="74" r="3" fill="#ffffff" />
  </g>
</svg>
