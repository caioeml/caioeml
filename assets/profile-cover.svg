<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated superhero web developer cover</title>
  <desc id="desc">A red and blue animated city cover with moving web lines and developer text for Caio Lima.</desc>
  <style>
    .web { stroke-dasharray: 20 18; animation: dash 8s linear infinite; }
    .web2 { stroke-dasharray: 12 22; animation: dash 11s linear infinite reverse; }
    .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
    .float { animation: float 4.8s ease-in-out infinite; }
    .blink { animation: blink 2.7s ease-in-out infinite; }
    .code { animation: slide 7s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -220; } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink { 0%,45%,100% { opacity: .35; } 55%,70% { opacity: 1; } }
    @keyframes slide { 0% { transform: translateX(-90px); opacity: .15; } 15%,80% { opacity: .5; } 100% { transform: translateX(90px); opacity: .15; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f" />
      <stop offset="0.48" stop-color="#102d64" />
      <stop offset="1" stop-color="#b5122b" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(884 132) rotate(134) scale(330 218)">
      <stop stop-color="#ff314f" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ff314f" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <rect width="1200" height="360" rx="28" fill="url(#glow)" />

  <g opacity="0.34">
    <path class="web" d="M-40 48C147 78 267 35 441 82C622 131 760 89 936 32C1055 -7 1146 12 1232 56" stroke="#eaf6ff" stroke-width="2" />
    <path class="web2" d="M-25 295C148 225 275 260 449 218C616 178 760 218 910 285C1036 342 1136 332 1230 284" stroke="#eaf6ff" stroke-width="2" />
    <path class="web" d="M955 -35C885 55 832 117 746 178C660 240 551 288 410 378" stroke="#eaf6ff" stroke-width="1.7" />
    <path class="web2" d="M1225 113C1082 127 973 150 852 207C734 263 657 316 569 401" stroke="#eaf6ff" stroke-width="1.7" />
  </g>

  <g opacity="0.25" stroke="#ffffff" stroke-width="1">
    <path d="M878 36L746 178L910 285M746 178L441 82M746 178L449 218M852 207L936 32M852 207L1232 56" />
    <circle cx="746" cy="178" r="82" />
    <circle cx="746" cy="178" r="135" />
    <circle cx="746" cy="178" r="198" />
  </g>

  <g class="code" fill="#9fd8ff" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18">
    <text x="88" y="304">&lt;React /&gt;</text>
    <text x="246" y="304">const dev = 'Caio';</text>
    <text x="520" y="304">API + UI + DB</text>
  </g>

  <g transform="translate(82 72)">
    <text x="0" y="54" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Caio Lima</text>
    <text x="0" y="96" fill="#b9ddff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Desenvolvedor Full Stack em evolução</text>
    <text x="0" y="138" fill="#eaf6ff" font-family="Segoe UI, Arial, sans-serif" font-size="20">React • JavaScript • PHP • MySQL • C# • .NET</text>
  </g>

  <g class="float" transform="translate(914 84)">
    <path d="M92 7C121 17 144 45 147 77C151 121 122 162 87 183C79 188 68 188 60 183C25 162 -4 121 0 77C3 45 25 17 55 7C67 3 80 3 92 7Z" fill="#d81735" stroke="#ff7184" stroke-width="4" filter="url(#softGlow)" />
    <path d="M47 70C62 55 84 55 100 70C91 82 78 88 64 88C56 88 50 82 47 70Z" fill="#eaf6ff" />
    <path d="M100 70C85 55 63 55 47 70C56 82 69 88 83 88C91 88 97 82 100 70Z" fill="#eaf6ff" opacity="0.9" transform="translate(0 0) scale(-1 1) translate(-147 0)" />
    <path d="M74 38V174M30 80C53 94 94 94 118 80M22 116C49 132 99 132 126 116" stroke="#6b0715" stroke-width="3" opacity="0.75" />
    <circle class="pulse" cx="74" cy="96" r="113" stroke="#ff405c" stroke-width="3" opacity="0.45" />
  </g>

  <g class="blink" filter="url(#softGlow)">
    <circle cx="102" cy="42" r="4" fill="#ffffff" />
    <circle cx="1090" cy="260" r="4" fill="#ffffff" />
    <circle cx="790" cy="74" r="3" fill="#ffffff" />
  </g>
</svg>
